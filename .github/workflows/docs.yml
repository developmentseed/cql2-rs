name: Docs

on:
  push:
    tags:
      # Must match the tags release-plz actually creates, which is also what
      # pypi.yml and npm.yml trigger on. A bare "v*" matches none of them.
      - "cql2-v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  docs:
    runs-on: ubuntu-latest
    env:
      GIT_COMMITTER_NAME: ci-bot
      GIT_COMMITTER_EMAIL: ci-bot@example.com
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0 # for git describe
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: build wasm
        run: scripts/buildwasm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install # we use uv instead of setup-python so we get python-version resolution between our two packages
      - name: Sync
        run: uv sync && uv sync --no-dev --inexact --directory python
      - name: Deploy
        run: |
          # release-plz tags the library as `cql2-vX.Y.Z`; strip the crate
          # prefix so the published docs version stays `vX.Y.Z`.
          TAG=$(git describe --tags --match="cql2-v*" --abbrev=0)
          VERSION=${TAG#cql2-}
          uv run mike deploy $VERSION latest --update-aliases --push
