name: npm

on:
  push:
    tags:
      - "cql2-v*"
  workflow_dispatch:

jobs:
  build:
    name: Build WASM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Build WASM for npm
        run: wasm-pack build --target web --out-dir pkg wasm
      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: npm-package
          path: wasm/pkg

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: build
    # Only ever publish from a tag, matching pypi.yml. A workflow_dispatch on a
    # branch still builds the package, but must not push it to npm.
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
      attestations: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/cql2-wasm
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm version
        run: npm install -g npm@latest
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: "package/*"
      - name: Publish to npm
        working-directory: package
        run: npm publish --provenance --access public
